# A session from monkey T, an animal the demo model has never seen.
# Used to show transfer: only new neuron (unit) + session embeddings are learned at
# first, while the pretrained POYO+ transformer stays frozen.
- selection:
  - brainset: perich_miller_population_2018
    sessions:
      - t_20130819_center_out_reaching
  config:
    multitask_readout:
      - readout_id: cursor_velocity_2d
        normalize_mean: [0.0, 0.0]
        normalize_std: [5.66, 6.06]
        ignore_intervals: [cursor_outlier_segments]  # cursor-tracking glitches (>1000 cm/s)
        metrics:
          - metric:
              _target_: torchmetrics.R2Score
